    <title>YAMANIX | نظام إدارة أسطول السيارات والسائقين</title>
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return originalFetch;
            },
            set: function(v) {
              originalFetch = v;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Ignore if property is non-configurable
        }
      })();
    </script>
